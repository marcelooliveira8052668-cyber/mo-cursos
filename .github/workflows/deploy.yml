# =============================================
# MO CURSOS - PUBLICAÇÃO DO SITE
# Arquivo: .github/workflows/deploy.yml
# =============================================

# Eu publico o site no GitHub Pages a cada push na main.
name: Publicar site no GitHub Pages

# Eu disparo o processo em cada envio para a branch principal.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Eu permito somente o que a publicação precisa.
permissions:
  contents: read
  pages: write
  id-token: write

# Eu evito publicações simultâneas disputando entre si.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Eu gero a versão de produção do site.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar o build
        run: npm run build

      - name: Configurar o GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar o site gerado
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Eu colo o build construído no endereço público.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
